[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dingdongditch"
version = "0.1.0"
description = "Port scanner that finds open ports, identifies each service and version, proves common misconfigurations, and ranks the CVEs it finds with a model trained on real attacks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mamdouh El Zein" }]
keywords = ["security", "port-scanner", "nmap", "cve", "vulnerability", "machine-learning", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "requests>=2.31",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "cryptography>=42",  # reading TLS certificates (--karen-mode)
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]  # only for `train --xgboost`
dev = ["pytest>=8", "ruff>=0.5", "xgboost>=2.0"]

[project.scripts]
dingdongditch = "dingdongditch.cli:app"

[project.urls]
Homepage = "https://github.com/Mamdouhelzein/dingdongditch"
Issues = "https://github.com/Mamdouhelzein/dingdongditch/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dingdongditch = ["data/*.json"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/dingdongditch.1"]  # pipx links this so `man dingdongditch` works

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option() defaults are the normal Typer style

[tool.pytest.ini_options]
testpaths = ["tests"]
