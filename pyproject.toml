[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portrisk"
version = "0.1.0"
description = "ML-powered risk scorer for open ports: parses nmap -sV output, matches services to CVEs, and predicts which are most likely to be exploited."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mamdouh El Zein" }]
keywords = ["security", "nmap", "cve", "vulnerability", "machine-learning", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "requests>=2.31",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "packaging>=23",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "shap>=0.45", "jupyter"]

[project.scripts]
portrisk = "portrisk.cli:app"

[project.urls]
Homepage = "https://github.com/Mamdouhelzein/portrisk"
Issues = "https://github.com/Mamdouhelzein/portrisk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portrisk = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option() defaults are the normal Typer style

[tool.pytest.ini_options]
testpaths = ["tests"]
